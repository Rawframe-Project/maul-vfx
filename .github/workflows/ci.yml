# Continuous integration for Maul VFX.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # apt retries a stalled download and gives up on a dead one.
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30
  PREFIX: MAUL_VFX

# bash with pipefail, so a piped command's failure fails its step: the
# default shell, bash -e without pipefail, takes the pipe's last status.
defaults:
  run:
    shell: bash

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples rhi -name '*.[ch]' 2>/dev/null)
      - name: The effect file's tables match the headers
        run: CLANG_FORMAT=clang-format python3 tools/gen_file.py --check
      - name: The effect fixtures' JSON and binary forms match
        run: python3 tools/effect_json.py --check test/fixtures
      - name: The kernel containers carry their sources' splice
        run: python3 tools/gen_kernels.py --check
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_VFX_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_VFX_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_VFX_BUILD_SHARED=ON" }
          - { name: linux-arm64-gcc-14,  os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: macos-clang,         os: macos-15,         cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends, with the sanitizers' runtime.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q gcc-14 g++-14 ninja-build
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      - name: Package
        # The installed package, used by a separate C17 project that knows
        # only it (samples/minimal).
        if: matrix.name == 'linux-shared'
        run: |
          cmake --install build --prefix "$PWD/package"
          cmake -S samples/minimal -B build-minimal -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_PREFIX_PATH="$PWD/package"
          cmake --build build-minimal
          LD_LIBRARY_PATH="$PWD/package/lib" ./build-minimal/minimal
      - name: Size
        # The library's code size, reported, not gated (family record
        # 0013).
        if: matrix.name == 'linux-gcc-14'
        run: size -t build/libmaul-vfx.a | tail -1

  # The API reference is generated from the headers; it must match them,
  # and the README must give its function count.
  docs:
    name: generated docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The API reference matches the headers
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }

  # Each fuzz target runs for one minute on every push, from the seed
  # corpus in test/corpus (minimized from local campaigns) and, for the
  # effect file reader, the golden scene's effects written as files: the
  # reader, and the step playing the effects fuzzed files make.
  rhi:
    # The GPU part with Maul RHI fetched: clang-tidy over its sources and
    # its kernels' tests on lavapipe, which must be found, under the
    # Vulkan validation layer, whose messages fail the step; then the same
    # under AddressSanitizer and UBSan.
    name: linux-rhi
    runs-on: ubuntu-24.04
    env:
      MESA_SHADER_CACHE_DIR: ${{ github.workspace }}/.mesa-cache
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler, lavapipe and the validation layer
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20 \
            libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q ninja-build mesa-vulkan-drivers vulkan-validationlayers
      # lavapipe compiles each kernel at its first dispatch, minutes for
      # the whole set: its shader cache is kept while the kernels, the
      # driver and the CPU stay the same. llvmpipe keys its cache on the
      # CPU's type, features and count (lp_screen.c, update_cache_sha1_cpu),
      # and the runners' CPUs differ, so a cache from another CPU would be
      # restored and never read.
      - name: Read the driver and the CPU
        id: mesa
        run: |
          echo "$(grep -m1 '^model name' /proc/cpuinfo), $(nproc) of $(nproc --all) CPUs"
          echo "version=$(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)" >> "$GITHUB_OUTPUT"
          cpu=$({ grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo; nproc; nproc --all; } \
            | sha256sum)
          echo "cpu=${cpu:0:16}" >> "$GITHUB_OUTPUT"
      - name: Restore lavapipe's shader cache
        uses: actions/cache@v6
        with:
          path: ${{ env.MESA_SHADER_CACHE_DIR }}
          key: mesa-${{ steps.mesa.outputs.version }}-${{ steps.mesa.outputs.cpu }}-${{ hashFiles('rhi/kernels/*_container.h', 'test/kernels/*_container.h') }}
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -D${PREFIX}_WERROR=ON
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -D${PREFIX}_RHI=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: clang-tidy
        run: |
          for f in rhi/src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done
      - name: Test
        env:
          MVFX_RHI_REQUIRED: 1
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          # The layer writes to each test's output, which ctest shows only
          # for a failed test and keeps for every test in LastTest.log,
          # beside the tests' paths: the pattern is the layer's own words,
          # case and all. bash -e ignores a status negated with !, so the
          # messages fail the step by an explicit exit.
          ctest --test-dir build -R rhi --output-on-failure --timeout 300
          build/test_rhi_kernels 2>&1 | tee kernels.log
          if grep -E "Validation Error|VUID-" build/Testing/Temporary/LastTest.log kernels.log; then
            exit 1
          fi
          # Each suite's warm-up frame: the kernels' compile when the
          # cache missed, a fraction of a second when it held them.
          awk '/ Testing: /{t=$3} /^longest frame/{print t ": " $0}' \
            build/Testing/Temporary/LastTest.log
          du -sh "$MESA_SHADER_CACHE_DIR"
      - name: Under the sanitizers
        # LeakSanitizer is off: lavapipe's own allocations, its module
        # unloaded before the report, cannot be suppressed by name; the
        # test counts the part's allocations itself.
        env:
          MVFX_RHI_REQUIRED: 1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cmake -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -D${PREFIX}_WERROR=ON \
            -D${PREFIX}_SANITIZE=ON -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -D${PREFIX}_RHI=ON
          cmake --build build-sanitize -j 4
          ctest --test-dir build-sanitize -R rhi --output-on-failure --timeout 300
          awk '/ Testing: /{t=$3} /^longest frame/{print t ": " $0}' \
            build-sanitize/Testing/Temporary/LastTest.log

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 \
            libclang-rt-20-dev ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_WERROR=ON -D${PREFIX}_BUILD_BENCH=OFF
          cmake --build build --target fuzz_file fuzz_step test_golden
      - name: The library writes the golden scene's effects as the fixtures
        run: |
          mkdir -p seeds
          build/test_golden --seeds seeds
          [ "$(ls seeds | wc -l)" = "$(ls test/fixtures/*.mvfx | wc -l)" ]
          for f in seeds/*.mvfx; do cmp "$f" "test/fixtures/$(basename $f)"; done
      - name: Run
        run: |
          mkdir -p corpus-fuzz_file
          build/test_golden --seeds corpus-fuzz_file
          for target in build/fuzz_*; do
            name=$(basename $target)
            mkdir -p "corpus-$name"
            tar -xzf "test/corpus/$name.tar.gz" -C "corpus-$name"
            "$target" -max_total_time=60 "corpus-$name"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # The registered tests, through node as the toolchain's emulator;
        # the manual sweeps are built but not run (conventions 13).
        run: |
          ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      - name: Size
        # The static library's size, reported, not gated (family record
        # 0013).
        run: stat -c '%s bytes' build/libmaul-vfx.a
