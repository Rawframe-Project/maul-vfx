# A throwaway probe for #65 (not to merge): rhi_kernels and rhi_sim on
# D3D12 on the redistributable WARP 1.0.22 beside the tests, under the
# Agility SDK 1.620.1's debug layer, on the hosted windows-2025 runner.
name: ci

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  windows-d3d12:
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@8414d388d2116b581c5c5d8f6641e1da4d863244 # v0.0.42
    permissions:
      contents: read
    with:
      preset: windows-rhi-d3d12
      runner: windows-2025
      setup: tools/ci_agility.sh
      timeout: 120
