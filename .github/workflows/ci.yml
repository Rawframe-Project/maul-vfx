# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer, runs clang-tidy on the kernel
# table and adds the GPU part's suites on lavapipe and rhi_kernels on
# D3D12 (WARP).
# Each build cell is a CMake preset built by the organization's shared
# workflow; the other jobs run in the same CI image, except the Emscripten
# build, which needs the emsdk action. docs/operations/checks.md explains each job, and
# tools/check.sh runs the Linux presets locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@c84f41e11c17d61e2876d65faf9aed1bea5130f7 # v0.0.19
    permissions:
      pull-requests: read

  docs:
    uses: Rawframe-Project/.github/.github/workflows/docs-check.yml@c84f41e11c17d61e2876d65faf9aed1bea5130f7 # v0.0.19
    permissions:
      contents: read

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@c84f41e11c17d61e2876d65faf9aed1bea5130f7 # v0.0.19
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the generated files, the
  # documentation site, and clang-tidy on the library and the GPU part. It
  # runs on documentation changes too, since the snippet check and the site
  # read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        # Every source but the generated tables and kernel containers.
        run: |
          clang-format --version
          # A checkout git refused would list nothing and pass unchecked.
          files=$(git ls-files '*.c' '*.h' ':!*_container.h' ':!src/file_fields.c' \
            ':!src/marching_table.c')
          [ -n "$files" ] || { echo "::error::git listed no sources"; exit 1; }
          echo "$files" | xargs -P 4 -n 32 clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_float_env.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: Generated files
        # The effect file's tables, the marching cubes tables, the kernel
        # containers' sources and the effect fixtures each match what their
        # tool writes.
        run: |
          python3 tools/gen_file.py --check
          python3 tools/gen_marching_cubes.py --check
          python3 tools/gen_kernels.py --check
          python3 tools/effect_json.py --check test/fixtures
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # rhi/src/kernels.c includes 70 MB of kernel containers and takes
        # clang-tidy minutes, so pull requests leave it to main and the night.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cmake --preset linux-clang-20 -B out/tidy -DMAUL_VFX_RHI=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON >/dev/null
          files=(src/*.c rhi/src/*.c)
          if [ "$EVENT" = pull_request ]; then
            mapfile -t files < <(printf '%s\n' "${files[@]}" | grep -vx rhi/src/kernels.c)
          fi
          printf '%s\n' "${files[@]}" |
            xargs -P 4 -n 4 clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*'
      - name: No stack frame over 64 KB, unoptimized
        # Both parts at -O0, where every temporary stays on the stack: the
        # optimized cells fold them, so only this build shows a frame past
        # the limit a host's thread may need (Windows gives it 1 MB).
        run: |
          cmake --preset linux-clang-20 -B out/frames -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG=-O0 -DMAUL_VFX_RHI=ON -DMAUL_VFX_BUILD_TESTS=OFF \
            -DMAUL_VFX_BUILD_BENCH=OFF -DMAUL_VFX_BUILD_SAMPLES=OFF >/dev/null
          cmake --build out/frames

  # Every cell builds with warnings as errors and runs its test preset.
  # linux-rhi runs the GPU part's suites that need no device on Maul RHI's
  # test driver, and the GPU sample on lavapipe as a smoke test; the suites
  # that need a device run on lavapipe at night (extended).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-arm64-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-rhi }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@c84f41e11c17d61e2876d65faf9aed1bea5130f7 # v0.0.19
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The installed shared library, used by a separate C17 project that knows
  # only the package (samples/minimal), and the static library's code size,
  # reported, not gated.
  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and use the package
        run: |
          cmake --preset linux-shared -B out/package-build -DMAUL_VFX_BUILD_TESTS=OFF \
            -DMAUL_VFX_BUILD_BENCH=OFF -DMAUL_VFX_BUILD_SAMPLES=OFF >/dev/null
          cmake --build out/package-build
          cmake --install out/package-build --prefix "$PWD/out/package"
          cmake -S samples/minimal -B out/minimal -G Ninja -DCMAKE_PREFIX_PATH="$PWD/out/package"
          cmake --build out/minimal
          LD_LIBRARY_PATH="$PWD/out/package/lib" out/minimal/minimal
      - name: Size
        run: |
          cmake --preset linux-gcc-14 -B out/size -DMAUL_VFX_BUILD_TESTS=OFF \
            -DMAUL_VFX_BUILD_BENCH=OFF -DMAUL_VFX_BUILD_SAMPLES=OFF >/dev/null
          cmake --build out/size
          size -t out/size/libmaul-vfx.a | tail -1

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX;
  # cl cannot build the library itself, which is C23.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The library under Emscripten, the suites in Node, and the static
  # library's size, reported, not gated. The CI image has no Emscripten, so
  # this job uses the runner and the emsdk action.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Configure
        run: cmake --preset web-emscripten
      - name: Build
        run: cmake --build --preset web-emscripten
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Size
        run: stat -c '%s bytes' out/web-emscripten/libmaul-vfx.a
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The effect file reader, and the step playing whatever effects fuzzed
  # files make: briefly on a pull request, longer on main and at night. Each
  # target's corpus carries from night to night in a cache, minimized after
  # the night's run; the committed seeds in test/corpus are its floor, and
  # the effect file reader also starts from the golden scene's effects.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 30 || 300 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the effect file reader's corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_file
          key: fuzz-corpus-fuzz_file-${{ github.run_id }}
          restore-keys: fuzz-corpus-fuzz_file-
      - name: Restore the step's corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_step
          key: fuzz-corpus-fuzz_step-${{ github.run_id }}
          restore-keys: fuzz-corpus-fuzz_step-
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -DMAUL_VFX_FUZZ=ON \
            -DMAUL_VFX_WERROR=ON -DMAUL_VFX_BUILD_BENCH=OFF -DMAUL_VFX_BUILD_SAMPLES=OFF
          cmake --build out/fuzz --target fuzz_file fuzz_step test_golden
      - name: The library writes the golden scene's effects as the fixtures
        run: |
          mkdir -p out/seeds
          out/fuzz/test_golden --seeds out/seeds
          [ "$(ls out/seeds | wc -l)" = "$(ls test/fixtures/*.mvfx | wc -l)" ]
          for f in out/seeds/*.mvfx; do cmp "$f" "test/fixtures/$(basename "$f")"; done
      - name: Run
        # The targets side by side; a target's output goes to its log,
        # printed when it finds something.
        run: |
          mkdir -p out/fuzz-logs
          for name in fuzz_file fuzz_step; do
            mkdir -p "out/corpus/$name"
            tar -xzf "test/corpus/$name.tar.gz" -C "out/corpus/$name"
          done
          cp out/seeds/*.mvfx out/corpus/fuzz_file/
          fuzz_one() {
            name=$(basename "$1")
            if "$1" -max_total_time="$FUZZ_SECONDS" "out/corpus/$name" >"out/fuzz-logs/$name.log" 2>&1; then
              echo "$name: no finding, $(find "out/corpus/$name" -type f | wc -l) inputs"
            else
              tail -n 60 "out/fuzz-logs/$name.log"
              echo "::error::$name found something"
              return 1
            fi
          }
          export -f fuzz_one
          printf '%s\n' out/fuzz/fuzz_file out/fuzz/fuzz_step | xargs -P 2 -I {} bash -c 'fuzz_one "$1"' _ {}
      - name: Minimize the corpora
        if: github.event_name == 'schedule'
        run: |
          for name in fuzz_file fuzz_step; do
            mkdir -p "out/merged/$name"
            "out/fuzz/$name" -merge=1 "out/merged/$name" "out/corpus/$name" >/dev/null 2>&1
            rm -rf "out/corpus/$name"
            mv "out/merged/$name" "out/corpus/$name"
            echo "$name: $(find "out/corpus/$name" -type f | wc -l) inputs kept"
          done
      - name: Save the effect file reader's corpus
        if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_file
          key: fuzz-corpus-fuzz_file-${{ github.run_id }}
      - name: Save the step's corpus
        if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/fuzz_step
          key: fuzz-corpus-fuzz_step-${{ github.run_id }}
      - name: Fuzz logs and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: |
            out/fuzz-logs/
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 7

  # The GPU part's suites on lavapipe, each scene stepped on both paths and
  # compared: under the Vulkan validation layer, and under AddressSanitizer
  # and UBSan. Nightly only: lavapipe compiles every kernel on one thread at
  # its first dispatch, and the suites take over an hour. The Mesa shader
  # cache the shared workflow keeps per CPU makes later nights faster.
  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-rhi-lavapipe, linux-rhi-lavapipe-asan]
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@c84f41e11c17d61e2876d65faf9aed1bea5130f7 # v0.0.19
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      timeout: 120

  # rhi_kernels on D3D12, on WARP under the Agility SDK's debug layer and
  # GPU-based validation; the suites that build a simulation stay out, as
  # WARP faults compiling its kernels (docs/operations/checks.md). Nightly
  # only until the shared changes workflow can tell a pull request that
  # touches the GPU part.
  windows-d3d12:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@c84f41e11c17d61e2876d65faf9aed1bea5130f7 # v0.0.19
    permissions:
      contents: read
    with:
      preset: windows-rhi-d3d12
      runner: windows-2025
      setup: tools/ci_agility.sh
      timeout: 120

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped (for a documentation-only change, or a nightly
  # job on a pull request), so adding or renaming a job never touches the
  # ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, package, msvc-headers, web-emscripten, fuzz, extended,
            windows-d3d12]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
